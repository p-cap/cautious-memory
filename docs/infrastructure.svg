    <path d="M28 28V55" fill="none" stroke="#34a853" stroke-width="7"/>
    <path d="M4 43L28 29L52 43" fill="none" stroke="#fbbc04" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <text x="728" y="411" class="h">Cloud Storage</text><text x="728" y="436" class="mono">signal-studio-imports-&lt;project-number&gt;</text>
  <rect x="728" y="462" width="391" height="91" class="yellow"/><text x="747" y="493" class="t">Private imported workspaces</text><text x="747" y="518" class="s">Source archives + built local previews</text><text x="747" y="538" class="s">Uniform access · public access prevention · lifecycle cleanup</text>
  <path d="M625 542H704" class="line"/>
  <rect x="58" y="630" width="180" height="35" class="panel"/><text x="72" y="652" class="mono">deploy-gcp.sh</text>
  <rect x="290" y="630" width="180" height="35" class="yellow"/><text x="327" y="652" class="mono">Cloud Build</text>
  <rect x="522" y="630" width="210" height="35" class="panel"/><text x="543" y="652" class="mono">Artifact Registry</text>
  <path d="M239 648H289" class="line"/><path d="M471 648H521" class="line"/><path d="M733 648H600V611" class="line"/>
  <text x="788" y="653" class="s">Build and deploy path</text>
</svg>
